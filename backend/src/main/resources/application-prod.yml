server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appointment_db}
    username: ${SPRING_DATASOURCE_USERNAME:appointment_user}
    password: ${SPRING_DATASOURCE_PASSWORD:appointment_pass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  ai:
    openai:
      api-key: ${GROQ_API_KEY:disabled}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.7

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 60000
          timeout: 60000
          writetimeout: 60000

logging:
  level:
    root: WARN
    com.appointment: INFO
    org.springframework.web: WARN
    org.springframework.mail: DEBUG
  file:
    name: /app/logs/application.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

app:
  mail:
    from: ${MAIL_USERNAME}
    from-name: AI Appointment System
    support-email: ${MAIL_USERNAME}
    frontend-url: ${FRONTEND_URL}
